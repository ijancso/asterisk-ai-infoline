; ─────────────────────────────────────────
; Asterisk Dialplan — AI Info Line
; ─────────────────────────────────────────

[globals]
AGI_SCRIPT=/var/lib/asterisk/agi-bin/ai_infoline.py

; ─────────────────────────────────────────
; Inbound calls from Twilio SIP trunk
; ─────────────────────────────────────────
[inbound-calls]

; Match any DID (catches all numbers pointed at this trunk)
exten => _X.,1,NoOp(Incoming call from ${CALLERID(num)} to ${EXTEN})
 same => n,Set(CALL_ID=${UNIQUEID})
 same => n,Set(CALLER_NUM=${CALLERID(num)})
 same => n,Answer()
 same => n,Wait(1)
 ; Hand off to AGI Python bridge
 same => n,AGI(ai_infoline.py,${CALL_ID},${CALLER_NUM})
 same => n,Hangup()

; Catch-all for unknown extensions
exten => i,1,NoOp(Invalid extension ${EXTEN})
 same => n,Hangup()

exten => h,1,NoOp(Call ${CALL_ID} hung up)

; ─────────────────────────────────────────
; Local test extension (dial 1000 from a SIP softphone on the same LAN)
; ─────────────────────────────────────────
[default]

exten => 1000,1,NoOp(Local test call)
 same => n,Answer()
 same => n,Wait(1)
 same => n,AGI(ai_infoline.py,test-${UNIQUEID},local-test)
 same => n,Hangup()
