[general]
context=default
allowoverlap=no
udpbindaddr=0.0.0.0
tcpenable=no
tcpbindaddr=0.0.0.0
transport=udp
srvlookup=yes
externip=${SERVER_PUBLIC_IP}
localnet=10.0.0.0/8
localnet=172.16.0.0/12
localnet=192.168.0.0/16
nat=force_rport,comedia
qualify=yes
disallow=all
allow=ulaw
allow=alaw

; ─────────────────────────────────────────
; Twilio SIP Trunk (inbound)
; ─────────────────────────────────────────
[twilio-trunk]
type=peer
host=${SIP_TRUNK_HOST}
username=${SIP_USERNAME}
secret=${SIP_PASSWORD}
fromuser=${SIP_USERNAME}
fromdomain=${SIP_TRUNK_HOST}
insecure=port,invite
context=inbound-calls
disallow=all
allow=ulaw
allow=alaw
dtmfmode=rfc2833
nat=force_rport,comedia
qualify=yes
